services:
  db:
    image: postgres:16-alpine
    container_name: vynl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: the backend reaches Postgres on the internal compose
    # network (db:5432). Publish it only for local tooling via a gitignored
    # docker-compose.override.yml (see README → Development → Backend).

  backend:
    build: ./backend
    container_name: vynl-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
      INVITE_CODE: ${INVITE_CODE:?INVITE_CODE must be set in .env}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      ITUNES_COUNTRIES: ${ITUNES_COUNTRIES:-US,JP,GB}
      COVERS_DIR: /app/covers
    volumes:
      - covers_data:/app/covers
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: vynl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  covers_data:
