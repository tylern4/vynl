<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- soft tile so the mark is visible on light and dark browser themes -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#f6f5f2" />
  <!-- grooved record body -->
  <circle cx="16" cy="16" r="13" fill="#2b2a26" />
  <g fill="none" stroke="#f6f5f2" stroke-width="1" opacity="0.3">
    <circle cx="16" cy="16" r="10.8" />
    <circle cx="16" cy="16" r="9.6" />
    <circle cx="16" cy="16" r="8.4" />
  </g>
  <!-- center label -->
  <circle cx="16" cy="16" r="6.2" fill="#b85c1e" />
  <circle cx="16" cy="16" r="6.2" fill="none" stroke="#a04e17" stroke-width="1" />
  <!-- brand V -->
  <path
    d="M12.3 13 L16 19.4 L19.7 13"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>