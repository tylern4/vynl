<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vynl</title>
    <script>
      // Apply the saved/system theme AND palette before first paint so there's
      // no flash of the wrong colors (kept in sync with src/theme.tsx).
      ;(function () {
        try {
          var t = localStorage.getItem('vynl_theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          // Palette axis: `vynl_palette` or the `default` palette.
          var p = localStorage.getItem('vynl_palette')
          if (!/^(default|citypop|cyberpunk|recordshop|hippie|deathmetal|punk|classical)$/.test(p || '')) {
            p = 'default'
          }
          document.documentElement.setAttribute('data-palette', p)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.setAttribute('data-palette', 'default')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
